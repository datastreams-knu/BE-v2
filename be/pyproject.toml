[project]
name = "knu-chatbot-be"
version = "0.1.0"
description = "KNU Chatbot Backend Server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=25.5.0",
    "python-ulid>=3.1.0",
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "email-validator>=2.3.0",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.28.1",
    "authlib>=1.7.2",
    "redis>=7.4.0",
    "testcontainers[postgres]>=4.8.0", 
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "psycopg2-binary>=2.9.12",
]

[tool.uv]
package = false  # 패키지로 빌드 안 함, 앱 실행만

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]